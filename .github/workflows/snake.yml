name: Gerar cobrinha de contribuições

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12 horas
  workflow_dispatch:           # permite rodar manualmente pela aba Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF4D6D&color_dots=#ebedf0,#D9C6F0,#B08AD9,#8A5BC2,#5E2F94
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF4D6D&color_dots=#161b22,#3A2257,#553080,#7B3FB5,#A566E0

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
